<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Radiant is a complete C# game engine, from the first prototype to the final release. Explore the guides and API reference." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Radiant Docs</title>
    <script>
      try {
        const stored = localStorage.getItem("radiant-docs-theme")
        const dark = stored === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : stored !== "light"
        document.documentElement.classList.toggle("dark", dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
